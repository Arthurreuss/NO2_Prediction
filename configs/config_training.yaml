api_requests:
  weather_api_base_url: https://archive-api.open-meteo.com/v1/archive
  air_quality_api_base_url: https://air-quality-api.open-meteo.com/v1/air-quality

  weather_params:
    hourly_variables:
      - temperature_2m
      - relative_humidity_2m
      - precipitation
      - pressure_msl
      - wind_speed_10m
      - wind_direction_10m
    timezone: Europe/Amsterdam
    temperature_unit: celsius
    wind_speed_unit: kmh
    precipitation_unit: mm

  air_quality_params:
    hourly_variables:
      - pm10
      - pm2_5
      - nitrogen_dioxide
      - ozone
    timezone: Europe/Amsterdam

  locations:
    utrecht:
      latitude: 52.0908
      longitude: 5.1222

  time:
    start_date: 2016-01-02 # 2016-01-01 misses two values
    end_date: 2024-12-31

  raw_dir: "data/training/raw"

data:
  single:
    train_path: "data/training/processed/utrecht/train.parquet"
    val_path: "data/training/processed/utrecht/val.parquet"
    test_path: "data/training/processed/utrecht/test.parquet"
    scaler_path: "data/training/processed/utrecht/scaler.pkl"
  multi:
    train_path: "data/training/processed/multi/train.parquet"
    val_path: "data/training/processed/multi/val.parquet"
    test_path: "data/training/processed/multi/test.parquet"
    scaler_path: "data/training/processed/multi/scaler.pkl"

  feature_cols:
    - temperature_2m
    - relative_humidity_2m
    - precipitation
    - pressure_msl
    - wind_speed_10m
    - wind_dir_10m_sin
    - wind_dir_10m_cos
    - pm10
    - pm2_5
    - ozone
    - nitrogen_dioxide
    - hour_sin
    - hour_cos
    - dayofweek_sin
    - dayofweek_cos
    - month_sin
    - month_cos

  target_col: nitrogen_dioxide

  target_cols:
    - nitrogen_dioxide
    - ozone
    - pm10
    - pm2_5

  input_length: 168
  horizon: 72


models:
  gru:
    hidden_size: 112
    num_layers: 2
    dropout: 0.38

  multi_gru:
    shared_hidden_size: 112
    branch_hidden_size: 64
    num_layers: 2
    dropout: 0.3

  hgru:
    downsample_factor: 24
    short_hidden_size: 64
    long_hidden_size: 32
    num_layers_short: 1
    num_layers_long: 1
    dropout: 0.3
  
  optimization_ranges:
    trials: 20
    gru:
      hidden_size:
        type: int
        min: 16
        max: 128
        step: 16
      num_layers:
        type: int
        min: 1
        max: 3
        step: 1
      dropout:
        type: float
        min: 0.0
        max: 0.5
      lr:
        type: float
        min: 1e-4
        max: 1e-2
        log: true
      weight_decay:
        type: float
        min: 1e-6
        max: 1e-2
        log: true

    hgru:
      downsample_factor:
        type: categorical
        values: [12, 24, 48]
      short_hidden_size:
        type: categorical
        values: [32, 64, 96, 128]
      long_hidden_size:
        type: categorical
        values: [32, 64, 96, 128]
      num_layers_short:
        type: int
        min: 1
        max: 2
        step: 1
      num_layers_long:
        type: int
        min: 1
        max: 2
        step: 1
      dropout:
        type: float
        min: 0.1
        max: 0.6
      lr:
        type: float
        min: 1e-4
        max: 5e-3
        log: true
      weight_decay:
        type: float
        min: 1e-7
        max: 1e-3
        log: true
    multi_gru:
      shared_hidden_size:
        type: int
        min: 16
        max: 128
        step: 16
      branch_hidden_size:
        type: int
        min: 8
        max: 64
        step: 8
      num_layers:
        type: int
        min: 1
        max: 3
        step: 1
      dropout:
        type: float
        min: 0.1
        max: 0.5
      lr:
        type: float
        min: 1e-4
        max: 1e-2
        log: true
      weight_decay:
        type: float
        min: 1e-6
        max: 1e-2
        log: true

training:
  mlflow:
    experiment_name: Refactored_Test
    run_postfix: test
  batch_size: 512
  num_epochs: 50
  lr: 0.001
  weight_decay: 0.0001
  grad_clip: 1.0
  patience: 5
  device: "auto"


