name: Hourly NO2 Forecast

on:
  schedule:
    - cron: '7 * * * *'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  run-and-sync:
    runs-on: ubuntu-latest
    
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          lfs: true

      - name: Install uv
        uses: astral-sh/setup-uv@v1

      - name: Set up Python 3.12
        run: uv python install 3.12

      - name: Install Dependencies
        run: |
          uv venv 
          uv pip install -r requirements.txt

      - name: Run Prediction Pipeline & Collect Stats
        id: prediction_step
        run: |
          START_TIME=$(date +%s)
          
          # Measure PEAK usage using /usr/bin/time
          # %M = Max Resident Set Size (KB)
          # %P = CPU Usage percentage
          /usr/bin/time -f "MAX_RAM_KB=%M\nCPU_PERCENT=%P" -o resource_usage.txt \
            uv run python -m deployment.run_inference
          
          END_TIME=$(date +%s)
          DURATION=$((END_TIME - START_TIME))
          
          # Read metrics from the file
          source resource_usage.txt
          
          # Convert KB to MB for cleaner JSON
          MAX_RAM_MB=$(echo "scale=1; $MAX_RAM_KB / 1024" | bc)
          
          # Get Disk Usage of the data folder (Actual Consumption)
          DATA_SIZE_MB=$(du -sm data/deployment | cut -f1)
          
          # Get General System Stats (Context)
          DISK_FREE=$(df -h / | awk 'NR==2 {print $4}')
          
          mkdir -p data/deployment
          
          jq -n \
            --arg last_run "$(TZ='Europe/Amsterdam' date +'%Y-%m-%d %H:%M:%S')" \
            --arg duration "$DURATION" \
            --arg status "success" \
            --arg max_ram "$MAX_RAM_MB" \
            --arg cpu_load "$CPU_PERCENT" \
            --arg disk_used "$DATA_SIZE_MB" \
            --arg disk_free "$DISK_FREE" \
            '{
              last_run: $last_run, 
              duration_seconds: ($duration|tonumber), 
              status: $status, 
              peak_metrics: {
                max_ram_mb: ($max_ram|tonumber),
                cpu_percent: $cpu_load,
                data_size_mb: ($disk_used|tonumber)
              },
              system_context: {
                disk_free: $disk_free
              }
            }' > data/deployment/latest_run.json
          
          cat data/deployment/latest_run.json

      - name: Calculate Dashboard Metrics
        run: |
          uv run python deployment/compute_metrics.py

      - name: Safe Commit and Push to GitHub
        run: |
          git config --global user.name 'GitHub Action'
          git config --global user.email 'action@github.com'
          
          git stash
          git pull --rebase origin dev
          git stash pop || echo "No stash to pop"
          git add .
          
          git diff --quiet && git diff --staged --quiet || git commit -m "Hourly Forecast Update: Predictions & Stats"
          git push origin dev

      - name: Push to Hugging Face Space
        env:
          HF_ACCESS_TOKEN: ${{ secrets.HF_ACCESS_TOKEN }}
          HF_USERNAME: ${{ secrets.HF_USERNAME }}  
          HF_SPACE_NAME: ${{ secrets.HF_SPACE_NAME }}
        run: |
          git lfs install
          rm -rf .git
          git init -b main
          git config user.email "action@github.com"
          git config user.name "GitHub Action"
          
          git lfs track "*.parquet"
          git add .
          git commit -m "Deploy Snapshot $(date)"
          
          git remote add space https://$HF_USERNAME:$HF_ACCESS_TOKEN@huggingface.co/spaces/$HF_USERNAME/$HF_SPACE_NAME
          git push --force space main:main