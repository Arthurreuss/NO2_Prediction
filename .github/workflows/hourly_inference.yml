name: Hourly NO2 Forecast

on:
  schedule:
    - cron: '1 * * * *'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  run-and-sync:
    runs-on: ubuntu-latest
    
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          lfs: true

      - name: Install uv
        uses: astral-sh/setup-uv@v1

      - name: Set up Python 3.12
        run: uv python install 3.12

      - name: Install Dependencies
        run: |
          uv venv 
          uv pip install -r requirements.txt

      - name: Run Prediction Pipeline & Collect Stats
        id: prediction_step
        run: |
          START_TIME=$(date +%s)
          
          uv run python -m deployment.deployment_pipeline
          
          END_TIME=$(date +%s)
          DURATION=$((END_TIME - START_TIME))
          
          MEMORY_INFO=$(free -h)
          DISK_INFO=$(df -h)
          
          mkdir -p data/deployment
          
          jq -n \
            --arg last_run "$(TZ='Europe/Amsterdam' date +'%Y-%m-%d %H:%M:%S %Z')" \
            --arg duration "$DURATION" \
            --arg status "success" \
            --arg runner "$RUNNER_OS" \
            --arg memory "$MEMORY_INFO" \
            --arg disk "$DISK_INFO" \
            '{
              last_run: $last_run, 
              duration_seconds: ($duration|tonumber), 
              status: $status, 
              runner_os: $runner,
              system_metrics: {
                memory: $memory,
                disk: $disk
              }
            }' > data/deployment/latest_run.json
          
          cat data/deployment/latest_run.json

      - name: Safe Commit and Push to GitHub
        run: |
          git config --global user.name 'GitHub Action'
          git config --global user.email 'action@github.com'
          
          git stash
          git pull --rebase origin dev
          git stash pop || echo "No stash to pop"
          git add .
          
          git diff --quiet && git diff --staged --quiet || git commit -m "Hourly Forecast Update: Predictions & Stats"
          git push origin dev

      - name: Push to Hugging Face Space
        env:
          HF_ACCESS_TOKEN: ${{ secrets.HF_ACCESS_TOKEN }}
          HF_USERNAME: Arthurreuss  
          HF_SPACE_NAME: NO2_Prediction
        run: |
          git remote add space https://$HF_USERNAME:$HF_ACCESS_TOKEN@huggingface.co/spaces/$HF_USERNAME/$HF_SPACE_NAME
          git push --force space dev:main