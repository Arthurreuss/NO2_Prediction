name: Hourly NO2 Forecast

on:
  schedule:
    # -------------------------------------------------------
    # THIS IS THE SCHEDULER
    # '15 * * * *' means: "Run at minute 15 of every hour"
    # (e.g., 08:15, 09:15, 10:15...)
    # -------------------------------------------------------
    - cron: '15 * * * *'
  
  # This allows you to click a "Run Now" button manually for testing
  workflow_dispatch:

permissions:
  contents: write

jobs:
  run-and-sync:
    runs-on: ubuntu-latest
    
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0 # Important for syncing history
          lfs: true      # Important for large model files

      - name: Install uv
        uses: astral-sh/setup-uv@v1

      - name: Set up Python 3.12
        run: uv python install 3.12

      - name: Install Dependencies
        run: uv pip install -r requirements.txt --system

      - name: Run Prediction Pipeline
        run: uv run python -m deployment.deployment_pipeline

      - name: Safe Commit and Push to GitHub
        run: |
          git config --global user.name 'GitHub Action'
          git config --global user.email 'action@github.com'
          
          git stash
          git pull --rebase origin dev
          git stash pop
          git add .
          git diff --quiet && git diff --staged --quiet || git commit -m "Hourly Forecast Update"
          git push origin dev

      - name: Push to Hugging Face Space
        env:
          HF_ACCESS_TOKEN: ${{ secrets.HF_TOKEN }}
          HF_USERNAME: Arthurreuss  
          HF_SPACE_NAME: NO2_Prediction
        run: |
          # Add the HF Space as a remote destination
          git remote add space https://$HF_USERNAME:$HF_TOKEN@huggingface.co/spaces/$HF_USERNAME/$HF_SPACE_NAME
          
          # Push everything (Code + New Data) to HF
          git push --force space main