name: Hourly Forecast

on:
  schedule:
    - cron: '5 * * * *'  # Run at 5 minutes past every hour
  workflow_dispatch:      # Allow manual run button

jobs:
  run-inference:
    runs-on: ubuntu-latest
    permissions:
      contents: write # Needed to commit the JSON file

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v4

      - name: Run Inference
        # uv run automatically installs deps from pyproject.toml and runs the script
        # We inject the secrets into the environment here
        env:
          MLFLOW_TRACKING_USERNAME: ${{ secrets.MLFLOW_TRACKING_USERNAME }}
          MLFLOW_TRACKING_PASSWORD: ${{ secrets.MLFLOW_TRACKING_PASSWORD }}
        run: uv run scripts/run_inference.py

      - name: Save Forecast
        # Simple commit-and-push if file changed
        run: |
          git config --global user.name 'ForecastBot'
          git config --global user.email 'bot@users.noreply.github.com'
          git add deployment/latest_forecast.json
          git diff --staged --quiet || (git commit -m "Update forecast [skip ci]" && git push)